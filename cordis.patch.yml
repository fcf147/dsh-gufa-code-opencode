# dsh-gufa-code-opencode bundle patch：标准 bundle 自挂载。
#
# 行 name 必须是包名原样（Host 半的 Node 导入说明符，也是 dsh-client-modules 扫描
# 浏览器半的键，经 exports["./client"] 解析到 client.js），Host/Client 两个半共享这一行。
# id 是稳定身份：profile 用户层可用该 id 做定向 config 覆盖。
#
# 本包 fork 自 dsh-gufa-code（MIT，作者 Jeff nan），新增 opencode 后端。
# id 沿用上游的 dsh-gufa-code，便于已有 profile 的定向配置继续生效。
- insert:
    - id: dsh-gufa-code
      name: 'dsh-gufa-code-opencode'
